[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marktux"
version = "0.1.0"
description = "Lightweight PyQt6 Markdown notebook application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PyQt6>=6.4",
    "cmarkgfm @ git+https://github.com/wachin/cmarkgfm@e28bfe3f2fdf0db3c61ee8a2b481cb218507ded5",
    "pygments>=2.15",
]

[project.scripts]
marktux = "marktux.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["marktux*"]

[tool.setuptools.package-data]
"marktux.core" = [
    "icons/*",
    "logo/*",
    "logo/*/*",
    "translations/*",
    "LICENSES/*",
]
