name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Only the editor component is needed; the other submodules are
      # reference forks that the application does not import.
      - name: Check out the editor component
        run: git submodule update --init libs/mtextedit

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 ripgrep

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e libs/mtextedit --no-deps
          pip install -e . --no-deps

      - name: Core and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t .

      - name: Editor component tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s libs/mtextedit/tests -t libs/mtextedit
